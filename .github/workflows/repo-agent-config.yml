# Reusable audit of a repository’s agent configuration.

name: repo-agent-config

on:
  workflow_call:
    inputs:
      lorien-ref:
        description: 'lorien ref the verifier is read from'
        required: false
        type: string
        default: 'main'
      deny-patterns:
        description: 'Extra case-insensitive regular expressions for machine-specific references, one per line'
        required: false
        type: string
        default: ''
      skip:
        description: 'Rules to skip, comma- or newline-separated'
        required: false
        type: string
        default: ''
      max-agents-bytes:
        description: 'AGENTS.md size cap in bytes (empty keeps the verifier default)'
        required: false
        type: string
        default: ''
    secrets:
      lorien-read-token:
        description: 'Token with read access to carrot-foundation/lorien contents'
        required: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: carrot-foundation/lorien
          ref: ${{ inputs.lorien-ref }}
          token: ${{ secrets.lorien-read-token }}
          path: .repo-agent-config/lorien
          sparse-checkout: apps/plugins/carrot-eng/scripts/repo-agent-config
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .repo-agent-config/lorien/.nvmrc

      - name: Audit agent configuration
        env:
          DENY_PATTERNS: ${{ inputs.deny-patterns }}
          SKIP_RULES: ${{ inputs.skip }}
          MAX_AGENTS_BYTES: ${{ inputs.max-agents-bytes }}
        run: |
          arguments=(--root "$GITHUB_WORKSPACE" --skip "$SKIP_RULES" --max-agents-bytes "$MAX_AGENTS_BYTES")
          while IFS= read -r pattern; do
            [ -n "$pattern" ] && arguments+=(--deny "$pattern")
          done <<< "$DENY_PATTERNS"
          node .repo-agent-config/lorien/apps/plugins/carrot-eng/scripts/repo-agent-config/repo-agent-config.runner.mts "${arguments[@]}"
